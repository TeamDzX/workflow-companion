# The offline test suite on every push to main, on Linux and macOS, so a
# release tag is only pushed once these are green.
name: Tests
on:
  push:
    branches: [main]
    paths: ["src/**", "test/**", ".github/workflows/test.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash test/run.sh
      - name: Shared rule cases
        run: bash test/rules/check.sh
