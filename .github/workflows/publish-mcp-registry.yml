# Publishes server.json to the official MCP Registry. GitHub OIDC proves this
# repo belongs to TeamDzX, which owns the io.github.TeamDzX/* namespace.
name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
